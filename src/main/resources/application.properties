spring.application.name=school-connect

# Pas d'utilisateur en memoire genere par Spring Security : l'authentification passe par notre JWT
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Base de donnees
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/schoolconnect}
spring.datasource.username=${DB_USER:schoolconnect}
spring.datasource.password=${DB_PASSWORD:schoolconnect}

# JPA / Hibernate : le schema est gere par Flyway, Hibernate se contente de le valider
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Serveur
server.port=${PORT:8080}
# Railway (et tout proxy TLS devant l'app) termine le HTTPS en amont : sans ceci, Spring ignore
# les en-tetes X-Forwarded-* et croit etre servi en http, ce qui casse l'URL generee par SpringDoc.
server.forward-headers-strategy=framework

# Actuator
management.endpoints.web.exposure.include=health,info

# JWT : 32 caracteres minimum. NE PAS utiliser la valeur par defaut en production : definir JWT_SECRET.
schoolconnect.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-0123456789}
schoolconnect.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# Si les deux sont renseignes et qu'aucun super-admin n'existe, il est cree au demarrage.
schoolconnect.bootstrap.admin-phone=${SCHOOLCONNECT_ADMIN_PHONE:}
schoolconnect.bootstrap.admin-password=${SCHOOLCONNECT_ADMIN_PASSWORD:}

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html